# Release-please opens a release PR from conventional commits on main; merging
# it tags the release, and the jobs below package the extension and publish it.
# They live in this workflow rather than on a `release` event because releases
# created with the default GITHUB_TOKEN do not trigger other workflows.

name: publish

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # The publish job can mint marketplace tokens, so it installs none of the
  # dev dependencies: tests and packaging run here, unprivileged, and publish
  # only uploads the .vsix built by this job.
  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx --yes @vscode/vsce@4 package --out rbs-inline-syntax.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: rbs-inline-syntax.vsix

  # The Marketplace trusts this workflow via OIDC trusted publishing, pinned
  # to this file name and the `release` environment; change either and
  # publishing stops.
  publish:
    needs: [release-please, verify]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - run: mv rbs-inline-syntax.vsix "rbs-inline-syntax-${TAG#v}.vsix"
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4 publish --oidc --packagePath rbs-inline-syntax-*.vsix
      - name: Attach to GitHub release
        run: gh release upload "$TAG" rbs-inline-syntax-*.vsix --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
