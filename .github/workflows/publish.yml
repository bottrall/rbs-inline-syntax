# Release-please opens a release PR from conventional commits on main; merging
# it tags the release, and the publish job packages and publishes the extension.
# It lives in this workflow rather than on a `release` event because releases
# created with the default GITHUB_TOKEN do not trigger other workflows.

name: publish

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # The Marketplace trusts this workflow via OIDC trusted publishing, pinned
  # to this file name and the `release` environment; change either and
  # publishing stops. Tests run in ci.yml, so this job only packages and
  # publishes. The extension has no runtime dependencies, so it skips `npm ci`
  # and packages with --no-dependencies.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes @vscode/vsce@4 package --no-dependencies --out "rbs-inline-syntax-${TAG#v}.vsix"
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4 publish --oidc --packagePath rbs-inline-syntax-*.vsix
      - name: Attach to GitHub release
        run: gh release upload "$TAG" rbs-inline-syntax-*.vsix --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
