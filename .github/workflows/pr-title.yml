# PR titles become the squash commit on main, and release-please reads them as
# conventional commits to pick the version bump and write the changelog. The
# check runs on every push as well, so it can be a required status check.

name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
